name: Integration Testing
on:
  workflow_dispatch:
jobs:
  integration-testing:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          java: 21
          arch: x64
          runner: windows-latest
    name: Integration Testing
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
    - name: Enable long paths for git on Windows
      if: runner.os == 'Windows'
      run: git config --system core.longpaths true
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '${{ matrix.java }}'
        distribution: 'adopt'
    - name: Dependencies Cache
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Print Maven version
      run: ./mvnw -version
    - name: Compile & Checkstyle
      run: ./mvnw clean -B -T 1C compile
    - name: install dependencies
      run: ./mvnw clean -B -T 1C install -U package -pl 
        '!spring-cloud-alibaba-coverage'  -DskipTests
    - name: Testing
      run: ./mvnw verify -B -T 1C -Dmaven.test.skip=false
#        run: mvn clean -Dit.enabled=true test
    - name: Delete snapshots from the Maven local repository
      run: find ~/.m2/repository -type d -name '*-SNAPSHOT' -print -exec rm -r 
        {} +
