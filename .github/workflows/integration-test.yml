name: Integration Testing
on:
  workflow_dispatch:
jobs:
  integration-testing:
    name: Integration Testing [ubuntu-latest--x64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'adopt'
    - name: Dependencies Cache
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Print Maven version
      run: ./mvnw -version
    - name: Compile & Checkstyle
      run: ./mvnw clean -B -T 1C compile
    - name: install dependencies
      run: ./mvnw clean -B -T 1C install -U package -pl 
        '!spring-cloud-alibaba-coverage'  -DskipTests
    - name: Testing
      run: ./mvnw verify -B -T 1C -Dmaven.test.skip=false
#        run: mvn clean -Dit.enabled=true test
    - name: Delete snapshots from the Maven local repository
      run: find ~/.m2/repository -type d -name '*-SNAPSHOT' -print -exec rm -r 
        {} +
    timeout-minutes: 150
